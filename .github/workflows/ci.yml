name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Typecheck (dashboard)
        run: pnpm --filter @gigantic/dashboard check

      - name: Build (dashboard)
        run: pnpm --filter @gigantic/dashboard build

      - name: Bridge smoke test
        run: |
          pnpm --filter @gigantic/bridge start &
          BRIDGE_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4000/status > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4000/status
          kill $BRIDGE_PID

  docker-images:
    runs-on: ubuntu-latest
    needs: check-and-build
    steps:
      - uses: actions/checkout@v4

      - name: Build dashboard image
        run: docker build -f apps/dashboard/Dockerfile -t gigantic-dashboard:ci .

      - name: Build bridge image
        run: docker build -f apps/bridge/Dockerfile -t gigantic-bridge:ci .
