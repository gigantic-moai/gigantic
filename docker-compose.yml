name: gigantic

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigantic
      POSTGRES_PASSWORD: gigantic
      POSTGRES_DB: gigantic
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gigantic']
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      DATABASE_URL: postgres://gigantic:gigantic@db:5432/gigantic
      P4PORT: ${P4PORT}
      P4USER: ${P4USER}
      P4DEPOT: ${P4DEPOT}
    ports:
      - '${DASHBOARD_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

  # orchestrator (Core) — Bridge 트랙 (B-1 ~ B-7)에서 구현됩니다.
  # orchestrator:
  #   build:
  #     context: .
  #     dockerfile: apps/bridge/Dockerfile
  #   ports:
  #     - '4000:4000'

volumes:
  pgdata:
